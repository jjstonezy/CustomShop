name: Build CustomShop

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode -f CustomShop_Project/pom.xml clean package

      - uses: actions/upload-artifact@v4
        with:
          name: CustomShop-JAR
          path: CustomShop_Project/target/*.jar
