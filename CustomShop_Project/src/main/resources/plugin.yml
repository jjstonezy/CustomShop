```yaml
name: CustomShop
main: com.customshop.CustomShopPlugin
version: 1.0.0
api-version: '1.21'
depend: [Vault]

commands:
  shop:
    description: Opens the custom shop.
    permission: customshop.use
  bounty:
    description: Opens the bounty menu.
    permission: customshop.use
    usage: /bounty
  bounties:
    description: Shows the top 10 active bounties.
    permission: customshop.use
    usage: /bounties
  menu:
    description: Opens the server menu.
    aliases: [hub]
    permission: customshop.use
    usage: /menu

permissions:
  customshop.use:
    description: Allows use of the shop, bounty and menu commands.
    default: true
```
