
name: CustomShop
main: com.customshop.CustomShopPlugin
version: 2.0.0
api-version: '1.21'
depend: [Vault]

commands:
  shop:
    description: Opens the server shop.
    usage: /shop
    permission: customshop.use

  menu:
    description: Opens the Site Chaos server menu.
    usage: /menu
    permission: customshop.use

  bounty:
    description: Place, view, and manage bounties.
    usage: /bounty help
    permission: customshop.use

  bounties:
    description: Shows the top active bounties.
    usage: /bounties
    permission: customshop.use

  ah:
    description: Opens and manages the auction house.
    aliases: [auction, auctionhouse]
    usage: /ah help
    permission: customshop.use

permissions:
  customshop.use:
    description: Allows access to the shop, menu, bounty, and auction commands.
    default: true
